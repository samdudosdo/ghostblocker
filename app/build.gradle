apply plugin: 'com.android.application'

android {
    namespace 'com.ghostblocker'
    compileSdk 29

    defaultConfig {
        applicationId "com.ghostblocker"
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
